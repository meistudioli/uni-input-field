<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Web Component: &lt;uni-input-field /> - a web component based on uniopen design language</title>
<meta name="description" content="uni-input-field is an encapsulated Web Component built upon the foundation of the uniopen design language. Implementation is straightforward: simply slot a standard input element inside uni-input-field. The component instantly applies a user interface that aligns seamlessly with the uniopen design language guidelines. Furthermore, its visual styles can be dynamically adapted via native HTML attributes or JavaScript properties. The component also exposes comprehensive character count and input length metadata, providing users with a clear and intuitive understanding of predefined character constraints." />
<script type="module" src="mjs/wc-uni-input-field.js"></script>
<link rel="stylesheet" href="https://blog.lalacube.com/mei/css/wc-base.css">
<link rel="stylesheet" href="https://blog.lalacube.com/mei/css/layers/radio-set.css">
<link rel="stylesheet" href="https://blog.lalacube.com/mei/css/layers/defaults.css">
<style>
#hd,#ft{display:none;}
body{position:relative;inline-size:100vw;block-size:100vh;margin:0;}

.wrap {
  inline-size: 100%;
  max-inline-size: min(800px, calc(100% - 2em));
  box-sizing: border-box;
}

.demo-wrap {
  position: relative;
  inline-size: min(100%, 800px);
  block-size: 160px;
  background-color: rgba(var(--white));
  margin: 6em auto 1em;
  padding: 1.5em;
  box-sizing: border-box;
  border-radius: 1em;
  display: flex;
  align-items: center;

  &+.setting-form {
    --subject-inline-size: auto;
    margin-block-start: 1em;
  }

  uni-input-field {
    inline-size: 100%;
  }
}

/* input */
uni-input-field {
  &::part(icon-subject) {
    /* style icon here */
  }

  &[data-hide-icon]::part(icon-subject) {
    display: none;
  }
}
</style>
</head>

<body class="flex-center">

<script type="module">
await customElements.whenDefined('uni-input-field');

const wrap = document.querySelector('.demo-wrap');
const uniInputField = document.querySelector('.demo-wrap uni-input-field');
const input = uniInputField.querySelector('input');
const form = document.querySelector('.setting-form');

const handler = (evt) => {
  const { target } = evt;
  const formData = new FormData(form);
  const fd = Object.fromEntries(formData.entries());

  switch (target.name) {
    case 'size': {
      uniInputField.size = fd['size'];
      break;
    }

    case 'appearance': {
      uniInputField.appearance = fd['appearance'];
      break;
    }

    case 'stat': {
      uniInputField.stat = fd['stat'] === 'normal' ? '' : fd['stat'];
      break;
    }

    case 'subject': {
      uniInputField.subject = fd['subject'] === 'show' ? 'Subject' : '';
      break;
    }

    case 'message': {
      uniInputField.message = fd['message'] === 'show' ? 'Supporting text' : '';
      break;
    }
    
    case 'counter': {
      if (fd['counter'] === 'show') {
        input.maxLength = 30;
      } else {
        input.removeAttribute('maxlength');
      }
      break;
    }

    case 'required': {
      input.required = fd['required'] === 'y';
      break;
    }

    case 'disabled': {
      input.disabled = fd['disabled'] === 'y';
      break;
    }

    case 'readonly': {
      input.readOnly = fd['readonly'] === 'y';
      break;
    }

    case 'type': {
      input.type = fd['type'];

      if (fd['type'] === 'text') {
        input.type = 'text';

        if (fd['counter'] === 'show') {
          input.maxLength = 30;
        } else {
          input.removeAttribute('maxlength');
        }
      } else {
        input.removeAttribute('maxlength');
      }
      break;
    }

    case 'icon': {
      uniInputField.toggleAttribute('data-hide-icon', fd['icon'] === 'hide')
      break;
    }
  }
};

form.addEventListener('input', handler);
</script>

</body>

</html>
